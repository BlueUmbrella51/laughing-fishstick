<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salesforce Data 360 Demo</title>

  <script src="https://cdn.c360a.salesforce.com/beacon/c360a/cf22d231-c8be-40d3-b864-d82cc67d8f72/scripts/c360a.min.js"></script>
  <script src="./app.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      padding: 12px 18px;
      margin: 6px;
      cursor: pointer;
    }
    #eventLog {
      background: #f2f2f2;
      padding: 16px;
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Salesforce Data 360 Event Lab</h1>

  <h2>Consent</h2>
  <p id="consentStatus">Not selected</p>
  <button id="acceptConsent">Accept Tracking</button>
  <button id="rejectConsent">Reject Tracking</button>

  <h2>Test Events</h2>
  <button id="pageViewButton">Send Page View</button>
  <button id="clickButton">Send Button Click</button>
  <button id="cartButton">Add to Cart</button>

  <h2>SDK Status</h2>
  <p id="sdkStatus">Waiting...</p>

  <h2>Event Log</h2>
  <div id="eventLog" role="log" aria-live="polite"></div>
</body>
</html>
